<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og.png source — render at 1200x630 with a headless browser screenshot</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      linear-gradient(#FBFAF4 0,#FBFAF4 55px,#B9CFE8 55px,#B9CFE8 57px);
    background-size:100% 57px;
    background-color:#FBFAF4;
    font-family:'Instrument Sans',system-ui,sans-serif;color:#20242E;
  }
  .margin-line{
    position:absolute;top:0;bottom:0;left:120px;width:3px;
    background:#D95B4E;opacity:.75;
  }
  .content{
    position:absolute;left:170px;top:120px;right:80px;
  }
  .mark{
    width:64px;height:64px;background:#fff;border:4px solid #20242E;
    border-radius:5px;position:relative;
    box-shadow:7px 7px 0 #D95B4E;margin-bottom:44px;
  }
  .mark::before{
    content:"";position:absolute;left:10px;right:10px;top:16px;height:4px;
    background:#B9CFE8;box-shadow:0 13px 0 #B9CFE8,0 26px 0 #B9CFE8;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;font-weight:750;
    font-size:110px;line-height:1.02;letter-spacing:-0.015em;margin:0 0 30px;
  }
  h1 em{font-style:normal;color:#2E5FA3}
  p{
    font-size:34px;color:#4A5060;margin:0;max-width:26ch;line-height:1.4;
  }
</style>
</head>
<body>
  <div class="margin-line"></div>
  <div class="content">
    <div class="mark"></div>
    <h1>Turning <em>Page</em></h1>
    <p>Excess paper, worksheets and creativity for Cape Town classrooms.</p>
  </div>
</body>
</html>
